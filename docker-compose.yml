services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icms
      POSTGRES_PASSWORD: icms_secret
      POSTGRES_DB: icms
    volumes:
      - icms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icms"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://icms:icms_secret@db:5432/icms
      JWT_SECRET: change-me-in-production
      # Local development/demo profile. Production deployments must override
      # this to production and inject a non-placeholder JWT_SECRET.
      ICMS_ENVIRONMENT: development
      DEMO_DATA_ENABLED: "true"
      PROVISION_PAYROLL_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${ICMS_BACKEND_PORT:-8010}:8000"

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://icms:icms_secret@db:5432/icms
      JWT_SECRET: change-me-in-production
      ICMS_ENVIRONMENT: development
      DEMO_DATA_ENABLED: "true"
      PROVISION_PAYROLL_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: python worker.py

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  icms_pgdata:
