services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icms
      POSTGRES_PASSWORD: icms_secret
      POSTGRES_DB: icms
    volumes:
      - icms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icms"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://icms:icms_secret@db:5432/icms
      JWT_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  icms_pgdata:
