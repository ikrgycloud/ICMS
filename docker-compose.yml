services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: icms
      POSTGRES_PASSWORD: icms_secret
      POSTGRES_DB: icms
    volumes:
      - icms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icms"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://icms:icms_secret@db:5432/icms
      JWT_SECRET: change-me-in-production
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8011:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        # Development-only credential shortcuts for the local localhost:8080 image.
        # docker-compose.prod.yml uses a separately built image and does not set this.
        VITE_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  icms_pgdata:
