services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${ICMS_BACKEND_PORT:-8011}:8000"

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      backend:
        condition: service_healthy
    command: python worker.py

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
