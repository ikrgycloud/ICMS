services:
  db:
    image: postgres:16-alpine
    # Optional local-only database. The normal server-backed profile does not
    # start this service; enable it explicitly with --profile local-db.
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: icms
      POSTGRES_PASSWORD: icms_secret
      POSTGRES_DB: icms
    volumes:
      - icms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icms"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # DATABASE_URL and production safeguards are supplied exclusively by
      # backend/.env. This keeps credentials out of Compose and makes the
      # configured PostgreSQL server the single persistence target.
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${ICMS_BACKEND_PORT:-8011}:8000"

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Must use the identical DATABASE_URL and production flags as backend.
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      backend:
        condition: service_healthy
    command: python worker.py

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  icms_pgdata:
