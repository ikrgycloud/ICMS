services:

  db:
    image: postgres:16-alpine
    container_name: icms-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - /data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - icms-network


  backend:
    image: ${BACKEND_IMAGE}
    container_name: icms-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - icms-network


  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: icms-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - icms-network


networks:
  icms-network:
    driver: bridge
