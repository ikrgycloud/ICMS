services:

  db:
    image: postgres:16-alpine
    container_name: icms-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - /data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - icms-network


  backend:
    image: ${BACKEND_IMAGE}
    container_name: icms-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ICMS_ENVIRONMENT: production
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      # Razorpay credentials are provided by the deployment environment and
      # must never be baked into the image or committed to this repository.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      # Bound PostgreSQL connections per API process. Tune only after database
      # monitoring shows sustained pool waiting or unused capacity.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}
      DEMO_DATA_ENABLED: "false"
      # Production data must be provisioned through approved migrations and
      # imports, never through development/demo seed routines on container start.
      PROVISION_PAYROLL_DATA: "false"

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - icms-network


  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: icms-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - icms-network


networks:
  icms-network:
    driver: bridge
