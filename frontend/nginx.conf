server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all client routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always fetch the latest app shell so UI deploys reflect immediately.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # Proxy API calls to the backend service
    location /api/ {
        # Resolve Docker's service name after a backend container is recreated.
        # Static startup-only DNS can retain the old container IP and turn an
        # otherwise healthy restart into repeated 502 responses.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $icms_backend backend:8000;
        proxy_pass http://$icms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }

    # Static asset caching
    location /assets/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }
}
